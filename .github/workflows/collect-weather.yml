name: Coleta meteorológica automática

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weatherflow-hourly-collector
  cancel-in-progress: false

jobs:
  collect:
    name: Atualizar banco histórico
    runs-on: ubuntu-latest
    steps:
      - name: Executar sincronização
        run: |
          curl --fail --show-error --silent \
            --retry 3 --retry-all-errors --max-time 120 \
            "https://matheus-analytics-guarulhos.matheusalmeidasiquei.chatgpt.site/api/weather" \
            --output weather-response.json

      - name: Validar persistência
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("weather-response.json").read_text())
          persistence = payload.get("persistence", {})

          if not payload.get("points"):
              raise SystemExit("A API não retornou registros meteorológicos.")
          if persistence.get("status") != "active":
              raise SystemExit("O banco não confirmou a persistência.")
          if persistence.get("lastRunStatus") != "success":
              raise SystemExit("A execução do pipeline não foi concluída.")

          print(
              f"Coleta aprovada: {len(payload['points'])} registros; "
              f"fonte={persistence.get('provider')}; "
              f"observações={persistence.get('observations')}; "
              f"previsões={persistence.get('forecasts')}"
          )
          PY
