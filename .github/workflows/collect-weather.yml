name: Coleta meteorológica automática

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weatherflow-collection
  cancel-in-progress: false

jobs:
  collect:
    name: Atualizar banco histórico
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Executar coleta idempotente
        run: |
          curl --fail-with-body \
            --retry 2 \
            --retry-all-errors \
            --max-time 150 \
            --request POST \
            "https://matheus-analytics-guarulhos.matheusalmeidasiquei.chatgpt.site/api/weather"
